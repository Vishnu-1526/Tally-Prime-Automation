[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tally-prime"
version = "0.1.0"
description = "AI-powered document pipeline for TallyPrime voucher automation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",

    # Settings / config
    "pydantic-settings>=2.2.1",
    "pydantic>=2.7.1",
    "python-dotenv>=1.0.1",

    # LLM / agent orchestration
    "langgraph>=0.1.5",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.7",

    # HTTP client
    "httpx>=0.27.0",

    # OCR / image processing
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9.0.80",
    "pillow>=10.3.0",

    # Task queue / caching
    "arq>=0.25.0",
    "redis>=5.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
